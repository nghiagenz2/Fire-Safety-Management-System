version: '3.9'
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pccc_db
    environment:
      POSTGRES_DB: pccc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    image: node:20-alpine
    container_name: pccc_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install; npm run dev"
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: pccc_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install; npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
